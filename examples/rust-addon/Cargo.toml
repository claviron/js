[package]
name = "claviron-js-example-addon"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
claviron-js = { path = "../..", features = ["napi"] }
napi = { version = "3.15", default-features = false, features = ["napi8"] }
napi-derive = "3.6.13"

[build-dependencies]
napi-build = "2.6"
