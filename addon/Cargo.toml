[package]
name = "claviron-js-addon"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
claviron-js = { path = "..", features = ["napi"] }

napi-derive = "3.6.13"
napi = { version = "3.16.1", default-features = false, features = ["napi8", "async-runtime"] }

[build-dependencies]
napi-build = "2.6"
