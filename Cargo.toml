[package]
name = "claviron-js"
version = "0.1.6"
edition = "2024"
publish = false
description = "Serve a Deno, Node or Bun application behind a Claviron edge over Orbit Link"
license = "MIT"
repository = "https://github.com/claviron/js"
include = ["/src/**", "/tests/unit/**", "/README.md", "/LICENSE", "!**/.DS_Store"]

[lib]
crate-type = ["rlib"]

[workspace]
members = ["addon", "examples/rust-addon"]
resolver = "3"

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
claviron = { version = "=0.2.1", default-features = false, features = ["orbit", "application"] }
napi = { version = "3.16.1", optional = true, default-features = false, features = ["napi8", "async-runtime", "async", "tokio_rt", "serde-json"] }
serde_json = "1"
napi-derive = { version = "3.6.13", optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1.54.1", features = ["io-util", "sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "io-std", "macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
